<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сфинкс: Эволюция 2.0</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сфинкс">
  <link rel="manifest" id="manifest-link">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; box-shadow: 0 0 20px #000; }
    #header { background: #16213e; padding: 12px; text-align: center; color: #e94560; font-weight: bold; font-size: 1.2em; border-bottom: 2px solid #e94560; }
    #chat { flex:1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s; }
    .msg.bot { background: #2d2d5e; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: #e94560; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.system { background: #4a3b5c; color: #ffb347; align-self: center; font-style: italic; font-size: 0.9em; max-width: 90%; }
    .time { font-size: 0.7em; color: #aaa; margin-top: 2px; text-align: right; }
    .msg.bot .time { text-align: left; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    #input-area { display: flex; flex-direction: column; padding: 8px; background: #0f0f1a; border-top: 1px solid #333; gap: 6px; }
    #cmd-row { display: flex; gap: 6px; }
    #cmd-input { flex: 1; min-width: 100px; background: #2a2a4a; border: none; padding: 10px; border-radius: 20px; color: white; font-size: 14px; outline: none; }
    .quick-btn { background: #3a3a6a; border: none; color: #ccc; padding: 8px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .quick-btn:active { background: #e94560; color: white; }
    .row-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">🐈‍⬛ СФИНКС • ЭВОЛЮЦИЯ 2.0</div>
  <div id="chat"></div>
  <div id="input-area">
    <div id="cmd-row">
      <input type="text" id="cmd-input" placeholder="Команда или выбор..." autofocus>
    </div>
    <div class="row-buttons">
      <button class="quick-btn" data-cmd="статус">📋 Статус</button>
      <button class="quick-btn" data-cmd="предложить играть">🎮 Игра</button>
      <button class="quick-btn" data-cmd="гладить">🤚 Гладить</button>
      <button class="quick-btn" data-cmd="предложить гулять">🚶 Гулять</button>
      <button class="quick-btn" data-cmd="предложить охоту">🐭 Охота</button>
      <button class="quick-btn" data-cmd="предложить трюк">🐾 Трюк</button>
      <button class="quick-btn" data-cmd="лазер">🔴 Лазер</button>
      <button class="quick-btn" data-cmd="предложить искать">🔍 Искать</button>
      <button class="quick-btn" data-cmd="ветеринар">🏥 Вет</button>
      <button class="quick-btn" data-cmd="предложить купаться">🛁 Купать</button>
      <button class="quick-btn" data-cmd="лакомство">🍬 Лакомство</button>
      <button class="quick-btn" data-cmd="поговорить">💬 Мяу</button>
      <button class="quick-btn" data-cmd="убрать лоток">🧹 Лоток</button>
      <button class="quick-btn" data-cmd="магазин">🛒 Магазин</button>
      <button class="quick-btn" data-cmd="инвентарь">🎒 Инв</button>
      <button class="quick-btn" data-cmd="продать">💰 Продать</button>
      <button class="quick-btn" data-cmd="лотерея">🎟️ Лотерея</button>
      <button class="quick-btn" data-cmd="ставка 20">🎲 Ставка</button>
      <button class="quick-btn" data-cmd="рулетка 5 20">🎰 Рулетка</button>
      <button class="quick-btn" data-cmd="торговец">🧳 Торговец</button>
      <button class="quick-btn" data-cmd="дневник">📖 Дневник</button>
      <button class="quick-btn" data-cmd="достижения">🏆 Достиж</button>
      <button class="quick-btn" data-cmd="помощь">❓</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const manifest = {
      name: "Сфинкс: Эволюция 2.0",
      short_name: "Сфинкс",
      start_url: ".",
      display: "standalone",
      background_color: "#0f0f1a",
      theme_color: "#1a1a2e",
      icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐈‍⬛%3C/text%3E%3C/svg%3E", sizes: "100x100", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  })();
</script>
<script>
  (function() {
    // ---------- СОСТОЯНИЕ ----------
    const STAGES = ['kitten','teen','young','adult','mature','senior','old'];
    const STAGE_DAYS = 45;
    const LEVELS = {
      1: { name: 'Новичок', exp: 0 },
      2: { name: 'Любитель', exp: 150, ability: '+10% к трюкам' },
      3: { name: 'Знаток', exp: 450, ability: '+5💰 за находку' },
      4: { name: 'Мастер', exp: 1050, ability: 'Шанс на двойную добычу' },
      5: { name: 'Эксперт', exp: 2100, ability: '+15% настроения от ласки' },
      6: { name: 'Виртуоз', exp: 3600, ability: 'Трюки приносят вдвое больше' },
      7: { name: 'Легенда', exp: 6000, ability: 'Шанс найти редкий предмет' }
    };

    let game = {
      name: 'Барсик', gender: 'male', birth: new Date().toISOString(),
      hunger: 100, thirst: 100, mood: 80, litter: 100, health: 100,
      money: 300, foodSupply: 10, waterSupply: 10, litterSupply: 5,
      items: { gps_collar: false, laser_pointer: false, cave_house: false, scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false, auto_feeder: false, cat_bed: false, cat_toy: false, cat_backpack: false, golden_ball: false, health_elixir: false, cat_wings: false },
      treats: 0, vitamins: 0, catnip: 0,
      diary: [], isSleeping: false,
      achievements: {}, currentDesire: null, location: 'гостиная', walks: 0, vetVisits: 0,
      lastHunt: null, lastDailyBonus: null, lastTrick: null,
      pendingEvent: null, sockCollectionIncome: 0,
      merchant: { active: false, until: null, items: [] },
      collectibles: { golden_fish: 0, mouse_toy: 0 },
      level: 1, exp: 0, totalActions: 0,
      lastToiletTime: null
    };

    function loadGame() {
      try {
        let saved = localStorage.getItem('sphinx_evo_v6');
        if (saved) {
          let parsed = JSON.parse(saved);
          game = Object.assign(game, parsed);
          if (!game.items) game.items = { gps_collar: false, laser_pointer: false, cave_house: false, scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false, auto_feeder: false, cat_bed: false, cat_toy: false, cat_backpack: false, golden_ball: false, health_elixir: false, cat_wings: false };
          game.treats = game.treats || 0;
          game.vitamins = game.vitamins || 0;
          game.catnip = game.catnip || 0;
          game.achievements = game.achievements || {};
          game.location = game.location || 'гостиная';
          game.walks = game.walks || 0;
          game.vetVisits = game.vetVisits || 0;
          game.pendingEvent = game.pendingEvent || null;
          game.merchant = game.merchant || { active: false, until: null, items: [] };
          game.collectibles = game.collectibles || { golden_fish: 0, mouse_toy: 0 };
          game.level = game.level || 1;
          game.exp = game.exp || 0;
          if (game.lastToiletTime === undefined) game.lastToiletTime = null;
        }
      } catch(e) {}
    }

    function saveGame() { localStorage.setItem('sphinx_evo_v6', JSON.stringify(game)); }

    function ageDays() { return (Date.now() - new Date(game.birth).getTime()) / (1000*60*60*24); }
    function currentStage() {
      let idx = Math.min(Math.floor(ageDays() / STAGE_DAYS), STAGES.length-1);
      return STAGES[idx] || 'kitten';
    }

    function addMessage(text, sender='bot') {
      let chat = document.getElementById('chat');
      let div = document.createElement('div');
      div.className = `msg ${sender}`;
      let now = new Date();
      div.innerHTML = text + `<div class="time">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function bar(value) {
      let p = Math.max(0, Math.min(100, Math.round(value)));
      let filled = Math.round(p/10);
      return '█'.repeat(filled) + '░'.repeat(10-filled) + ` ${p}%`;
    }

    function gainExp(amount) {
      game.exp += Math.floor(amount / 3);
      let newLevel = game.level;
      for (let lvl = 7; lvl >= 1; lvl--) { if (game.exp >= LEVELS[lvl].exp) { newLevel = lvl; break; } }
      if (newLevel > game.level) {
        game.level = newLevel;
        let abilityText = LEVELS[newLevel].ability ? `\n🎯 Способность: ${LEVELS[newLevel].ability}` : '';
        addMessage(`🎉 Уровень ${newLevel}: "${LEVELS[newLevel].name}"!${abilityText}`, 'system');
        game.diary.push({time: new Date().toISOString(), text: `Достигнут уровень ${newLevel}.`});
      }
    }

    function getLevelBonus(type) {
      const lvl = game.level;
      switch(type) {
        case 'trick': return lvl >= 6 ? 2 : (lvl >= 2 ? 1.1 : 1);
        case 'find': return lvl >= 3 ? 5 : 0;
        case 'hunt': return lvl >= 4 ? 0.2 : 0;
        case 'mood': return lvl >= 5 ? 1.15 : 1;
        case 'legendary': return lvl >= 7 ? 0.05 : 0;
        default: return 1;
      }
    }

    // ========== ЖИВЫЕ СООБЩЕНИЯ ==========
    const eatMessages = [
      '🍗 Кот с аппетитом поел корма. Теперь он сытый и довольно мурчит.',
      '🥣 Кот уминает корм за обе щеки, иногда поглядывая на вас благодарным взглядом.',
      '🍽️ Мисочка опустела. Кот вылизывает губы и трётся о ваши ноги.',
      '🐟 Кот съел всё до крошки, урчит как маленький моторчик.',
      '🍲 Кот уплетает корм, иногда отвлекаясь на свои уши (куда они у сфинкса?).',
      '🥩 Кот насытился, теперь он важный и довольный.'
    ];
    const drinkMessages = [
      '💧 Кот лакает воду, немного расплескав вокруг — везде мокрые следы.',
      '🥛 Попил водички, оставил мокрый носик и лужицу на полу.',
      '🚰 Кот жадно пьёт, иногда чихая от усердия.',
      '💦 Кот попил и теперь довольно умывается лапой.',
      '🧊 Попив, кот стал бодрее и начал исследовать комнату.',
      '🌊 Кот попил и разбрызгал воду — настоящий фонтанчик.'
    ];
    const toiletMessages = [
      '💩 Кот сходил в лоток и раскидал вокруг наполнитель. Пора убирать.',
      '🚽 Кот посетил туалет, теперь вокруг лотка настоящий хаос.',
      '🧹 Сфинкс справил нужду и с невинным видом отошёл, оставив беспорядок.',
      '🐾 Кот закопал свои дела, но наполнитель разлетелся по всей комнате.',
      '💨 В лотке снова неаккуратно — кот явно спешил по своим делам.',
      '🚫 Лоток в плачевном состоянии: кот сходил в туалет и даже не пытался закопать.',
      '🧻 Наполнитель разбросан — кот усердно копал после туалета.',
      '😼 Кот посмотрел на вас и демонстративно пошёл в лоток, оставив «сюрприз».'
    ];

    // ========== ОБРАБОТКА КОМАНД ==========
    function processCommand(cmd) {
      cmd = cmd.trim().toLowerCase();
      if (game.pendingEvent) { handlePendingEvent(cmd); return; }
      const firstWord = cmd.split(' ')[0];
      const awakeOnly = ['предложить','гладить','лакомство','поговорить','лазер','ветеринар','искать','трюк','охота','играть','гулять','купать','спать','разбудить','ждать','назвать','осмотреться','кухня','спальня','ванная','гостиная','использовать','кормить','поить','лоток','лотерея','ставка','рулетка'];
      if (game.isSleeping && awakeOnly.includes(firstWord) && firstWord !== 'разбудить') { addMessage('Кот спит… Попробуйте разбудить.', 'system'); return; }
      switch(firstWord) {
        case 'статус': showStatus(); break;
        case 'убрать': if (cmd === 'убрать лоток') cleanLitterBox(); break;
        case 'предложить':
          if (cmd.includes('играть')) proposePlay();
          else if (cmd.includes('гулять')) proposeWalk();
          else if (cmd.includes('охоту')) proposeHunt();
          else if (cmd.includes('трюк')) proposeTrick();
          else if (cmd.includes('искать')) proposeSearch();
          else if (cmd.includes('купаться')) proposeBath();
          else addMessage('Предложение не распознано.', 'system');
          break;
        case 'гладить': proposePet(); break;
        case 'лакомство': giveTreat(); break;
        case 'поговорить': meow(); break;
        case 'лазер': proposeLaser(); break;
        case 'ветеринар': proposeVet(); break;
        case 'разбудить': wakeUp(); break;
        case 'магазин': shop(); break;
        case 'инвентарь': showInventory(); break;
        case 'продать':
          if (cmd.startsWith('продать ')) sellItem(cmd.replace('продать ','').trim());
          else addMessage('Введите: продать [предмет]', 'system');
          break;
        case 'лотерея': scratchCard(); break;
        case 'ставка': sportBet(cmd); break;
        case 'рулетка': roulette(cmd); break;
        case 'торговец': showMerchant(); break;
        case 'дневник': showDiary(); break;
        case 'достижения': showAchievements(); break;
        case 'помощь': showHelp(); break;
        case 'купить':
          if (cmd.startsWith('купить у торговца ')) buyFromMerchant(cmd.replace('купить у торговца ','').trim());
          else if (cmd.startsWith('купить ')) buyItem(cmd.replace('купить ','').trim());
          else addMessage('Купить [товар] или купить у торговца [товар]', 'system');
          break;
        case 'использовать':
          if (cmd.startsWith('использовать ')) useItem(cmd.replace('использовать ','').trim());
          else addMessage('Что использовать?', 'system');
          break;
        case 'осмотреться': lookAround(); break;
        case 'кухня': case 'спальня': case 'ванная': case 'гостиная': changeLocation(cmd); break;
        default:
          if (cmd.startsWith('назвать ')) renameCat(cmd.replace('назвать ','').trim());
          else if (cmd.startsWith('ждать ')) {
            let m = parseInt(cmd.replace('ждать ',''));
            if (isNaN(m) || m<1 || m>480) addMessage('Минуты от 1 до 480.', 'system');
            else skipTime(m);
          }
          else addMessage('Неизвестная команда. Введите помощь.', 'system');
      }
    }

    function handlePendingEvent(answer) {
      const event = game.pendingEvent; if (!event) return;
      game.pendingEvent = null;
      const choice = parseInt(answer);
      if (isNaN(choice) || choice < 1 || choice > event.choices.length) { addMessage('Введите 1, 2 или 3.', 'system'); game.pendingEvent = event; return; }
      const outcome = event.choices[choice-1];
      if (outcome.money) game.money += outcome.money;
      if (outcome.hunger) game.hunger = Math.min(100, Math.max(0, game.hunger + outcome.hunger));
      if (outcome.mood) game.mood = Math.min(100, Math.max(0, game.mood + outcome.mood));
      if (outcome.health) game.health = Math.min(100, Math.max(0, game.health + outcome.health));
      if (outcome.item) game.items[outcome.item] = true;
      addMessage(outcome.text, 'bot');
      game.diary.push({time: new Date().toISOString(), text: `Событие: ${outcome.short}`});
      gainExp(10); saveGame();
    }

    // ========== АВТОНОМНЫЙ ТИК (еда, питьё + туалет) ==========
    function autonomousCatTick() {
      if (game.pendingEvent) return;
      if (game.isSleeping) {
        game.hunger = Math.max(0, game.hunger - 0.2);
        if (Math.random() < 0.3) { game.isSleeping = false; game.mood = Math.min(100, game.mood + 10); addMessage('Кот проснулся и потягивается.', 'bot'); saveGame(); }
        return;
      }
      
      // Еда
      if (game.hunger < 40 && game.foodSupply > 0) {
        game.foodSupply--;
        game.hunger = Math.min(100, game.hunger + 35);
        let msg = eatMessages[Math.floor(Math.random() * eatMessages.length)];
        addMessage(msg, 'bot');
        game.currentDesire = null;
        gainExp(5);
        saveGame();
        return;
      }
      
      // Питьё
      if (game.thirst < 40 && game.waterSupply > 0) {
        game.waterSupply--;
        game.thirst = Math.min(100, game.thirst + 35);
        let msg = drinkMessages[Math.floor(Math.random() * drinkMessages.length)];
        addMessage(msg, 'bot');
        game.currentDesire = null;
        gainExp(5);
        saveGame();
        return;
      }
      
      // Лоток (автоматическое загрязнение + сообщение, если кот сходил)
      if (game.litter < 25 && game.litterSupply > 0 && game.currentDesire !== 'чистый лоток') {
        game.currentDesire = 'чистый лоток';
        addMessage('Кот мяукает у лотка, ему некомфортно.', 'system');
        saveGame();
        return;
      }
      
      // Новое: кот самостоятельно ходит в туалет с вероятностью и ограничением по времени
      const now = Date.now();
      const toiletCooldown = 120000; // 2 минуты
      if (!game.lastToiletTime || (now - game.lastToiletTime) > toiletCooldown) {
        if (Math.random() < 0.04) { // ~ раз в 12-15 минут (тик 30 сек)
          let msg = toiletMessages[Math.floor(Math.random() * toiletMessages.length)];
          addMessage(msg, 'bot');
          // Уменьшаем чистоту лотка на 6-12 единиц (эффект "наследил")
          let dirt = Math.floor(Math.random() * 8) + 5;
          game.litter = Math.max(0, game.litter - dirt);
          game.lastToiletTime = now;
          // Небольшой шанс получить - к настроению, если лоток сильно грязный
          if (game.litter < 20) game.mood = Math.max(0, game.mood - 5);
          saveGame();
          return;
        }
      }
      
      // Обычное падение показателей
      game.hunger = Math.max(0, game.hunger - 0.3);
      game.thirst = Math.max(0, game.thirst - 0.4);
      game.litter = Math.max(0, game.litter - 0.3);
      
      // Авто-игра или поднятие настроения
      if (game.mood < 50) {
        game.mood = Math.min(100, game.mood + 10);
        addMessage('Кот играет сам с собой, гоняя воображаемую мышь.', 'bot');
        gainExp(5);
      }
      saveGame();
    }

    // ========== ДЕЙСТВИЯ ==========
    function showStatus() {
      let desireText = game.currentDesire ? `\n💭 Хочет: ${game.currentDesire}` : '';
      let levelInfo = `\n⭐ Ур. ${game.level} (${LEVELS[game.level].name}) | Опыт: ${game.exp}/${LEVELS[Math.min(7, game.level+1)]?.exp || 'MAX'}`;
      let abilityText = LEVELS[game.level].ability ? `\n🎯 ${LEVELS[game.level].ability}` : '';
      let msg = `🐈‍⬛ <b>${game.name}</b> (${currentStage()})${levelInfo}${abilityText}\n\n`;
      msg += `🍗 Сытость: ${bar(game.hunger)}\n💧 Жажда: ${bar(game.thirst)}\n😊 Настроение: ${bar(game.mood)}\n🚽 Лоток: ${bar(game.litter)}\n❤️ Здоровье: ${bar(game.health)}\n`;
      msg += `💰 Монеты: ${game.money}\n📦 Корм: ${game.foodSupply} 💧 Вода: ${game.waterSupply} 🧻 Наполнитель: ${game.litterSupply}\n🍬 Лакомств: ${game.treats} 💊 Витаминов: ${game.vitamins}\n📍 ${game.location}${desireText}`;
      if (game.isSleeping) msg += '\n😴 Кот спит.';
      addMessage(msg, 'bot');
    }

    function proposePlay() {
      if (game.isSleeping) return;
      const plays = [
        'Вы достали перьевую игрушку. Кот начал высоко подпрыгивать, пытаясь её поймать!',
        'Кот притащил скомканную бумажку: «Кидай!»',
        'Вы играете с котом в прятки. Он залез в коробку и думает, что его не видно.',
