<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сфинкс: Эволюция 2.0</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сфинкс">
  <link rel="manifest" id="manifest-link">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; box-shadow: 0 0 20px #000; }
    #header { background: #16213e; padding: 12px; text-align: center; color: #e94560; font-weight: bold; font-size: 1.2em; border-bottom: 2px solid #e94560; }
    #chat { flex:1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s; }
    .msg.bot { background: #2d2d5e; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: #e94560; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.system { background: #4a3b5c; color: #ffb347; align-self: center; font-style: italic; font-size: 0.9em; max-width: 90%; }
    .time { font-size: 0.7em; color: #aaa; margin-top: 2px; text-align: right; }
    .msg.bot .time { text-align: left; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    #input-area { display: flex; flex-direction: column; padding: 8px; background: #0f0f1a; border-top: 1px solid #333; gap: 6px; }
    #cmd-row { display: flex; gap: 6px; }
    #cmd-input { flex: 1; min-width: 100px; background: #2a2a4a; border: none; padding: 10px; border-radius: 20px; color: white; font-size: 14px; outline: none; }
    .quick-btn { background: #3a3a6a; border: none; color: #ccc; padding: 8px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .quick-btn:active { background: #e94560; color: white; }
    .row-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">🐈‍⬛ СФИНКС • ЭВОЛЮЦИЯ 2.0</div>
  <div id="chat"></div>
  <div id="input-area">
    <div id="cmd-row">
      <input type="text" id="cmd-input" placeholder="Команда или выбор..." autofocus>
    </div>
    <div class="row-buttons">
      <button class="quick-btn" data-cmd="статус">📋 Статус</button>
      <button class="quick-btn" data-cmd="предложить играть">🎮 Игра</button>
      <button class="quick-btn" data-cmd="гладить">🤚 Гладить</button>
      <button class="quick-btn" data-cmd="предложить гулять">🚶 Гулять</button>
      <button class="quick-btn" data-cmd="предложить охоту">🐭 Охота</button>
      <button class="quick-btn" data-cmd="предложить трюк">🐾 Трюк</button>
      <button class="quick-btn" data-cmd="лазер">🔴 Лазер</button>
      <button class="quick-btn" data-cmd="предложить искать">🔍 Искать</button>
      <button class="quick-btn" data-cmd="ветеринар">🏥 Вет</button>
      <button class="quick-btn" data-cmd="предложить купаться">🛁 Купать</button>
      <button class="quick-btn" data-cmd="лакомство">🍬 Лакомство</button>
      <button class="quick-btn" data-cmd="поговорить">💬 Мяу</button>
      <button class="quick-btn" data-cmd="убрать лоток">🧹 Лоток</button>
      <button class="quick-btn" data-cmd="магазин">🛒 Магазин</button>
      <button class="quick-btn" data-cmd="инвентарь">🎒 Инв</button>
      <button class="quick-btn" data-cmd="продать">💰 Продать</button>
      <button class="quick-btn" data-cmd="лотерея">🎟️ Лотерея</button>
      <button class="quick-btn" data-cmd="ставка 20">🎲 Ставка</button>
      <button class="quick-btn" data-cmd="рулетка 5 20">🎰 Рулетка</button>
      <button class="quick-btn" data-cmd="торговец">🧳 Торговец</button>
      <button class="quick-btn" data-cmd="дневник">📖 Дневник</button>
      <button class="quick-btn" data-cmd="достижения">🏆 Достиж</button>
      <button class="quick-btn" data-cmd="помощь">❓</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // PWA Manifest
    const manifest = {
      name: "Сфинкс: Эволюция 2.0",
      short_name: "Сфинкс",
      start_url: ".",
      display: "standalone",
      background_color: "#0f0f1a",
      theme_color: "#1a1a2e",
      icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐈‍⬛%3C/text%3E%3C/svg%3E", sizes: "100x100", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  })();
</script>
<script>
  (function() {
    // ---------- СОСТОЯНИЕ ----------
    const STAGES = ['kitten','teen','young','adult','mature','senior','old'];
    const STAGE_DAYS = 45;
    const LEVELS = {
      1: { name: 'Новичок', exp: 0 },
      2: { name: 'Любитель', exp: 150, ability: '+10% к трюкам' },
      3: { name: 'Знаток', exp: 450, ability: '+5💰 за находку' },
      4: { name: 'Мастер', exp: 1050, ability: 'Шанс на двойную добычу' },
      5: { name: 'Эксперт', exp: 2100, ability: '+15% настроения от ласки' },
      6: { name: 'Виртуоз', exp: 3600, ability: 'Трюки приносят вдвое больше' },
      7: { name: 'Легенда', exp: 6000, ability: 'Шанс найти редкий предмет' }
    };

    let game = {
      name: 'Барсик', gender: 'male', birth: new Date().toISOString(),
      hunger: 100, thirst: 100, mood: 80, litter: 100, health: 100,
      money: 300, foodSupply: 10, waterSupply: 10, litterSupply: 5,
      items: { gps_collar: false, laser_pointer: false, cave_house: false, scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false, auto_feeder: false, cat_bed: false, cat_toy: false, cat_backpack: false, golden_ball: false, health_elixir: false, cat_wings: false },
      treats: 0, vitamins: 0, catnip: 0,
      diary: [], isSleeping: false,
      achievements: {}, currentDesire: null, location: 'гостиная', walks: 0, vetVisits: 0,
      lastHunt: null, lastDailyBonus: null, lastTrick: null,
      pendingEvent: null, sockCollectionIncome: 0,
      merchant: { active: false, until: null, items: [] },
      collectibles: { golden_fish: 0, mouse_toy: 0 },
      level: 1, exp: 0, totalActions: 0
    };

    function loadGame() {
      try {
        let saved = localStorage.getItem('sphinx_evo_v4');
        if (saved) {
          let parsed = JSON.parse(saved);
          game = Object.assign(game, parsed);
          if (!game.items) game.items = { gps_collar: false, laser_pointer: false, cave_house: false, scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false, auto_feeder: false, cat_bed: false, cat_toy: false, cat_backpack: false, golden_ball: false, health_elixir: false, cat_wings: false };
          game.treats = game.treats || 0;
          game.vitamins = game.vitamins || 0;
          game.catnip = game.catnip || 0;
          game.achievements = game.achievements || {};
          game.location = game.location || 'гостиная';
          game.walks = game.walks || 0;
          game.vetVisits = game.vetVisits || 0;
          game.pendingEvent = game.pendingEvent || null;
          game.merchant = game.merchant || { active: false, until: null, items: [] };
          game.collectibles = game.collectibles || { golden_fish: 0, mouse_toy: 0 };
          game.level = game.level || 1;
          game.exp = game.exp || 0;
        }
      } catch(e) {}
    }

    function saveGame() { localStorage.setItem('sphinx_evo_v4', JSON.stringify(game)); }

    function ageDays() { return (Date.now() - new Date(game.birth).getTime()) / (1000*60*60*24); }
    function currentStage() {
      let idx = Math.min(Math.floor(ageDays() / STAGE_DAYS), STAGES.length-1);
      return STAGES[idx] || 'kitten';
    }

    function addMessage(text, sender='bot') {
      let chat = document.getElementById('chat');
      let div = document.createElement('div');
      div.className = `msg ${sender}`;
      let now = new Date();
      div.innerHTML = text + `<div class="time">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function bar(value) {
      let p = Math.max(0, Math.min(100, Math.round(value)));
      let filled = Math.round(p/10);
      return '█'.repeat(filled) + '░'.repeat(10-filled) + ` ${p}%`;
    }

    function gainExp(amount) {
      game.exp += Math.floor(amount / 3);
      let newLevel = game.level;
      for (let lvl = 7; lvl >= 1; lvl--) { if (game.exp >= LEVELS[lvl].exp) { newLevel = lvl; break; } }
      if (newLevel > game.level) {
        game.level = newLevel;
        let abilityText = LEVELS[newLevel].ability ? `\n🎯 Способность: ${LEVELS[newLevel].ability}` : '';
        addMessage(`🎉 Уровень ${newLevel}: "${LEVELS[newLevel].name}"!${abilityText}`, 'system');
        game.diary.push({time: new Date().toISOString(), text: `Достигнут уровень ${newLevel}.`});
      }
    }

    function getLevelBonus(type) {
      const lvl = game.level;
      switch(type) {
        case 'trick': return lvl >= 6 ? 2 : (lvl >= 2 ? 1.1 : 1);
        case 'find': return lvl >= 3 ? 5 : 0;
        case 'hunt': return lvl >= 4 ? 0.2 : 0;
        case 'mood': return lvl >= 5 ? 1.15 : 1;
        case 'legendary': return lvl >= 7 ? 0.05 : 0;
        default: return 1;
      }
    }

    // ========== ОБРАБОТКА КОМАНД ==========
    function processCommand(cmd) {
      cmd = cmd.trim().toLowerCase();
      if (game.pendingEvent) { handlePendingEvent(cmd); return; }
      const firstWord = cmd.split(' ')[0];
      const awakeOnly = ['предложить','гладить','лакомство','поговорить','лазер','ветеринар','искать','трюк','охота','играть','гулять','купать','спать','разбудить','ждать','назвать','осмотреться','кухня','спальня','ванная','гостиная','использовать','кормить','поить','лоток','лотерея','ставка','рулетка'];
      if (game.isSleeping && awakeOnly.includes(firstWord) && firstWord !== 'разбудить') { addMessage('Кот спит… Попробуйте разбудить.', 'system'); return; }
      switch(firstWord) {
        case 'статус': showStatus(); break;
        case 'убрать': if (cmd === 'убрать лоток') cleanLitterBox(); break;
        case 'предложить':
          if (cmd.includes('играть')) proposePlay();
          else if (cmd.includes('гулять')) proposeWalk();
          else if (cmd.includes('охоту')) proposeHunt();
          else if (cmd.includes('трюк')) proposeTrick();
          else if (cmd.includes('искать')) proposeSearch();
          else if (cmd.includes('купаться')) proposeBath();
          else addMessage('Предложение не распознано.', 'system');
          break;
        case 'гладить': proposePet(); break;
        case 'лакомство': giveTreat(); break;
        case 'поговорить': meow(); break;
        case 'лазер': proposeLaser(); break;
        case 'ветеринар': proposeVet(); break;
        case 'разбудить': wakeUp(); break;
        case 'магазин': shop(); break;
        case 'инвентарь': showInventory(); break;
        case 'продать':
          if (cmd.startsWith('продать ')) sellItem(cmd.replace('продать ','').trim());
          else addMessage('Введите: продать [предмет]', 'system');
          break;
        case 'лотерея': scratchCard(); break;
        case 'ставка': sportBet(cmd); break;
        case 'рулетка': roulette(cmd); break;
        case 'торговец': showMerchant(); break;
        case 'дневник': showDiary(); break;
        case 'достижения': showAchievements(); break;
        case 'помощь': showHelp(); break;
        case 'купить':
          if (cmd.startsWith('купить у торговца ')) buyFromMerchant(cmd.replace('купить у торговца ','').trim());
          else if (cmd.startsWith('купить ')) buyItem(cmd.replace('купить ','').trim());
          else addMessage('Купить [товар] или купить у торговца [товар]', 'system');
          break;
        case 'использовать':
          if (cmd.startsWith('использовать ')) useItem(cmd.replace('использовать ','').trim());
          else addMessage('Что использовать?', 'system');
          break;
        case 'осмотреться': lookAround(); break;
        case 'кухня': case 'спальня': case 'ванная': case 'гостиная': changeLocation(cmd); break;
        default:
          if (cmd.startsWith('назвать ')) renameCat(cmd.replace('назвать ','').trim());
          else if (cmd.startsWith('ждать ')) {
            let m = parseInt(cmd.replace('ждать ',''));
            if (isNaN(m) || m<1 || m>480) addMessage('Минуты от 1 до 480.', 'system');
            else skipTime(m);
          }
          else addMessage('Неизвестная команда. Введите помощь.', 'system');
      }
    }

    function handlePendingEvent(answer) {
      const event = game.pendingEvent; if (!event) return;
      game.pendingEvent = null;
      const choice = parseInt(answer);
      if (isNaN(choice) || choice < 1 || choice > event.choices.length) { addMessage('Введите 1, 2 или 3.', 'system'); game.pendingEvent = event; return; }
      const outcome = event.choices[choice-1];
      if (outcome.money) game.money += outcome.money;
      if (outcome.hunger) game.hunger = Math.min(100, Math.max(0, game.hunger + outcome.hunger));
      if (outcome.mood) game.mood = Math.min(100, Math.max(0, game.mood + outcome.mood));
      if (outcome.health) game.health = Math.min(100, Math.max(0, game.health + outcome.health));
      if (outcome.item) game.items[outcome.item] = true;
      addMessage(outcome.text, 'bot');
      game.diary.push({time: new Date().toISOString(), text: `Событие: ${outcome.short}`});
      gainExp(10); saveGame();
    }

    // ========== АВТОНОМНЫЙ ТИК ==========
    function autonomousCatTick() {
      if (game.pendingEvent) return;
      if (game.isSleeping) {
        game.hunger = Math.max(0, game.hunger - 0.2);
        if (Math.random() < 0.3) { game.isSleeping = false; game.mood = Math.min(100, game.mood + 10); addMessage('Кот проснулся и потягивается.', 'bot'); saveGame(); }
        return;
      }
      if (Math.random() < 0.05) { game.isSleeping = true; addMessage('Кот зевнул и задремал.', 'bot'); saveGame(); return; }
      if (game.hunger < 40 && game.foodSupply > 0) { game.foodSupply--; game.hunger = Math.min(100, game.hunger + 35); addMessage('Кот поел.', 'bot'); game.currentDesire = null; gainExp(5); saveGame(); return; }
      if (game.thirst < 40 && game.waterSupply > 0) { game.waterSupply--; game.thirst = Math.min(100, game.thirst + 35); addMessage('Кот попил.', 'bot'); game.currentDesire = null; gainExp(5); saveGame(); return; }
      if (game.litter < 25 && game.litterSupply > 0 && game.currentDesire !== 'чистый лоток') { game.currentDesire = 'чистый лоток'; addMessage('Кот мяукает у лотка.', 'system'); saveGame(); return; }
      if (game.mood < 50) { game.mood = Math.min(100, game.mood + 10); addMessage('Кот играет сам с собой.', 'bot'); gainExp(5); saveGame(); return; }
      game.hunger = Math.max(0, game.hunger - 0.3);
      game.thirst = Math.max(0, game.thirst - 0.4);
      game.litter = Math.max(0, game.litter - 0.3);
      saveGame();
    }

    // ========== ДЕЙСТВИЯ ==========
    function showStatus() {
      let desireText = game.currentDesire ? `\n💭 Хочет: ${game.currentDesire}` : '';
      let levelInfo = `\n⭐ Ур. ${game.level} (${LEVELS[game.level].name}) | Опыт: ${game.exp}/${LEVELS[Math.min(7, game.level+1)]?.exp || 'MAX'}`;
      let abilityText = LEVELS[game.level].ability ? `\n🎯 ${LEVELS[game.level].ability}` : '';
      let msg = `🐈‍⬛ <b>${game.name}</b> (${currentStage()})${levelInfo}${abilityText}\n\n`;
      msg += `🍗 Сытость: ${bar(game.hunger)}\n💧 Жажда: ${bar(game.thirst)}\n😊 Настроение: ${bar(game.mood)}\n🚽 Лоток: ${bar(game.litter)}\n❤️ Здоровье: ${bar(game.health)}\n`;
      msg += `💰 Монеты: ${game.money}\n📦 Корм: ${game.foodSupply} 💧 Вода: ${game.waterSupply} 🧻 Наполнитель: ${game.litterSupply}\n🍬 Лакомств: ${game.treats} 💊 Витаминов: ${game.vitamins}\n📍 ${game.location}${desireText}`;
      if (game.isSleeping) msg += '\n😴 Кот спит.';
      addMessage(msg, 'bot');
    }

    function proposePlay() { if (game.isSleeping) return; game.mood = Math.min(100, game.mood + 15); addMessage('Вы поиграли!', 'bot'); gainExp(15); saveGame(); }
    function proposePet() { if (game.isSleeping) return; const bonus = Math.floor(12 * getLevelBonus('mood')); game.mood = Math.min(100, game.mood + bonus); addMessage('Кот мурчит.', 'bot'); gainExp(5); saveGame(); }
    function proposeWalk() {
      if (!game.items.gps_collar) return addMessage('Нужен GPS-ошейник.', 'system');
      if (game.isSleeping) return;
      game.mood = Math.min(100, game.mood + 15); game.walks++;
      let reward = Math.floor(Math.random()*20)+5 + getLevelBonus('find');
      if (game.items.cat_wings) reward *= 2;
      game.money += reward;
      addMessage(`Прогулка! +${reward}💰`, 'bot');
      checkAchievement('walker'); gainExp(15); saveGame();
    }
    function proposeHunt() {
      if (game.isSleeping) return;
      if (game.lastHunt && (Date.now() - new Date(game.lastHunt).getTime()) < 3600000) return addMessage('Охота раз в час.', 'system');
      game.lastHunt = new Date().toISOString();
      let ok = Math.random() < 0.7 + getLevelBonus('hunt');
      let reward = ok ? Math.floor(Math.random()*40)+10 : 0;
      game.money += reward;
      addMessage(ok ? `Добыча! +${reward}💰` : 'Убежала.', 'bot');
      if (ok) checkAchievement('hunter');
      gainExp(ok ? 20 : 5); saveGame();
    }
    function proposeTrick() { if (game.isSleeping) return; if (Math.random() < 0.6) { let r = Math.floor((Math.floor(Math.random()*15)+5) * getLevelBonus('trick')); game.money += r; addMessage(`Дал лапу! +${r}💰`, 'bot'); } else addMessage('Не понимает.', 'bot'); gainExp(10); saveGame(); }
    function proposeSearch() {
      if (game.isSleeping) return;
      if (Math.random() < 0.5) {
        let r = Math.floor(Math.random()*15)+3 + getLevelBonus('find');
        game.money += r;
        if (Math.random() < getLevelBonus('legendary')) { game.collectibles.golden_fish++; addMessage(`Золотая рыбка! +${r}💰`, 'bot'); }
        else addMessage(`Нашёл! +${r}💰`, 'bot');
      } else addMessage('Ничего.', 'bot');
      gainExp(10); saveGame();
    }
    function proposeBath() { if (game.isSleeping) return; if (Math.random() < 0.6) return addMessage('Кот вырывается.', 'bot'); game.mood = Math.min(100, game.mood + (Math.random() > 0.4 ? 10 : -5)); addMessage('Искупался.', 'bot'); gainExp(5); saveGame(); }
    function wakeUp() { if (!game.isSleeping) return; game.isSleeping = false; addMessage('Кот разбужен.', 'bot'); saveGame(); }
    function cleanLitterBox() {
      if (game.litterSupply <= 0) return addMessage('Нет наполнителя.', 'system');
      game.litterSupply--; game.litter = 100; game.mood = Math.min(100, game.mood + 15);
      if (game.currentDesire === 'чистый лоток') { game.money += 10; addMessage('+10💰', 'system'); }
      game.currentDesire = null; addMessage('Лоток чист.', 'bot'); gainExp(5); saveGame();
    }
    function giveTreat() { if (game.treats <= 0) return addMessage('Нет лакомств.', 'system'); game.treats--; game.mood = Math.min(100, game.mood + 20); addMessage('Лакомство съедено.', 'bot'); gainExp(10); saveGame(); }
    function proposeLaser() { if (!game.items.laser_pointer) return addMessage('Нет лазера.', 'system'); game.mood = Math.min(100, game.mood + 15); addMessage('Пятнышко!', 'bot'); gainExp(5); saveGame(); }
    function proposeVet() { if (game.money < 60) return addMessage('Нужно 60💰.', 'system'); game.money -= 60; game.health = 100; game.vetVisits++; game.mood = Math.min(100, game.mood + 20); addMessage('Осмотрен.', 'bot'); checkAchievement('vet'); gainExp(20); saveGame(); }
    function meow() { addMessage(['Мяу!','Мр-ряу!','Мя?','Мур.','Р-р-мяу!'][Math.floor(Math.random()*5)], 'bot'); gainExp(2); saveGame(); }
    function lookAround() { addMessage(`Вы в ${game.location}.`, 'bot'); }
    function changeLocation(loc) { game.location = loc; addMessage(`Перешли в ${loc}.`, 'system'); saveGame(); }
    function renameCat(name) { if(name.length>20)return; game.name=name; addMessage(`Теперь ${name}.`, 'system'); saveGame(); }

    // ========== МАГАЗИН (+20% к цене) ==========
    function shop() {
      let t = `🛒 <b>Магазин (+20%)</b>\n\n<u>Расходники:</u>\n🍗 Корм (10) - 60💰\n💧 Вода (10) - 36💰\n🧻 Наполнитель (5) - 48💰\n🍬 Лакомство - 24💰\n💊 Витамины - 96💰\n🧶 Котовья мята - 30💰\n\n<u>Предметы:</u>\n🔴 Лазер - 180💰\n📡 GPS-ошейник - 240💰\n🏠 Домик - 300💰\n🪶 Когтеточка - 216💰\n🛌 Лежанка - 264💰\n🎒 Кот-рюкзак - 360💰\n🍽️ Автокормушка - 600💰\n🛏️ Кровать - 480💰\n🧸 Заводная мышь - 144💰\n\n<i>купить [название]</i>`;
      addMessage(t, 'bot');
    }

    function buyItem(item) {
      const prices = {
        'корм':60, 'вода':36, 'наполнитель':48, 'лакомство':24, 'витамины':96, 'котовья мята':30,
        'лазер':180, 'лазерная указка':180, 'ошейник':240, 'gps ошейник':240, 'домик':300, 'домик-пещера':300,
        'когтеточка':216, 'лежанка':264, 'лежанка с подогревом':264, 'кот-рюкзак':360, 'автокормушка':600,
        'кошачья кровать':480, 'заводная мышь':144
      };
      if (!prices[item]) return addMessage('Товар не найден.', 'system');
      if (game.money < prices[item]) return addMessage('Недостаточно монет.', 'system');
      game.money -= prices[item];
      if (item === 'корм') game.foodSupply += 10;
      else if (item === 'вода') game.waterSupply += 10;
      else if (item === 'наполнитель') game.litterSupply += 5;
      else if (item === 'лакомство') game.treats++;
      else if (item === 'витамины') game.vitamins++;
      else if (item === 'котовья мята') game.catnip++;
      else if (item.includes('лазер')) game.items.laser_pointer = true;
      else if (item.includes('ошейник')) game.items.gps_collar = true;
      else if (item.includes('домик')) game.items.cave_house = true;
      else if (item.includes('когтеточка')) game.items.scratching_post = true;
      else if (item.includes('лежанка')) game.items.heated_bed = true;
      else if (item.includes('рюкзак')) game.items.cat_backpack = true;
      else if (item.includes('автокормушка')) game.items.auto_feeder = true;
      else if (item.includes('кровать')) game.items.cat_bed = true;
      else if (item.includes('мышь')) game.items.cat_toy = true;
      addMessage('Куплено!', 'system'); saveGame();
    }

    function showInventory() {
      let inv = [];
      for (let [k,v] of Object.entries(game.items)) {
        if (v) {
          let name = { gps_collar:'GPS-ошейник', laser_pointer:'Лазер', cave_house:'Домик', scratching_post:'Когтеточка', heated_bed:'Лежанка', bird_cage:'Птичка', sock_collection:'Носки', auto_feeder:'Автокормушка', cat_bed:'Кровать', cat_toy:'Заводная мышь', cat_backpack:'Кот-рюкзак', golden_ball:'Золотой клубок', health_elixir:'Эликсир здоровья', cat_wings:'Крылья для кота' }[k] || k;
          inv.push(name);
        }
      }
      let text = `🎒 Инвентарь:\n${inv.length ? inv.join(', ') : 'Пусто'}\n🍬 Лакомств: ${game.treats} 💊 Витаминов: ${game.vitamins} 🧶 Мята: ${game.catnip}\nВведите: продать [предмет]`;
      addMessage(text, 'bot');
    }

    function sellItem(item) {
      const prices = { 'лазер':90, 'ошейник':120, 'домик':150, 'когтеточка':108, 'лежанка':132, 'птичка':80, 'носки':50, 'автокормушка':300, 'кровать':240, 'заводная мышь':72, 'кот-рюкзак':180, 'золотой клубок':210, 'эликсир здоровья':120, 'крылья для кота':300 };
      let key = item.includes('лазер')?'laser_pointer': item.includes('ошейник')?'gps_collar': item.includes('домик')?'cave_house': item.includes('когтеточка')?'scratching_post': item.includes('лежанка')?'heated_bed': item.includes('птич')?'bird_cage': item.includes('нос')?'sock_collection': item.includes('автокормуш')?'auto_feeder': item.includes('кроват')?'cat_bed': item.includes('мыш')?'cat_toy': item.includes('рюкзак')?'cat_backpack': item.includes('клубок')?'golden_ball': item.includes('эликсир')?'health_elixir': item.includes('крыл')?'cat_wings': null;
      if (!key || !game.items[key]) return addMessage('Нет такого предмета.', 'system');
      game.items[key] = false; game.money += prices[key] || 50;
      addMessage(`Продано за ${prices[key]||50}💰`, 'system'); saveGame();
    }

    function scratchCard() {
      if (game.money < 12) return addMessage('Билет стоит 12💰.', 'system');
      game.money -= 12;
      let win = Math.random() < 0.1 ? 60 : (Math.random() < 0.3 ? 24 : (Math.random() < 0.7 ? 6 : 0));
      game.money += win;
      addMessage(`🎟️ Лотерея: +${win}💰`, 'bot'); gainExp(5); saveGame();
    }

    function sportBet(cmd) {
      if (game.money < 20) return addMessage('Мин. ставка 20💰.', 'system');
      let parts = cmd.split(' ');
      let bet = parseInt(parts[1]) || 20;
      bet = Math.min(game.money, Math.max(20, bet));
      game.money -= bet;
      let win = Math.random() < 0.4;
      if (win) { let prize = bet * 2; game.money += prize; addMessage(`🎲 Ставка ${bet}💰. Выигрыш ${prize}💰!`, 'bot'); }
      else addMessage(`🎲 Ставка ${bet}💰. Проигрыш.`, 'bot');
      gainExp(10); saveGame();
    }

    function roulette(cmd) {
      if (game.money < 10) return addMessage('Мин. ставка 10💰.', 'system');
      let parts = cmd.split(' ');
      let number = Math.floor(Math.random() * 10) + 1;
      let bet = 10;
      if (parts.length >= 2 && !isNaN(parseInt(parts[1]))) {
        let chosen = parseInt(parts[1]);
        if (chosen >= 1 && chosen <= 10) {
          if (parts.length >= 3 && !isNaN(parseInt(parts[2]))) bet = Math.min(game.money, Math.max(10, parseInt(parts[2])));
          game.money -= bet;
          if (chosen === number) { let prize = bet * 9; game.money += prize; addMessage(`🎰 ${bet}💰 на ${chosen}. Выпало ${number}! +${prize}💰`, 'bot'); }
          else addMessage(`🎰 ${bet}💰 на ${chosen}. Выпало ${number}.`, 'bot');
        } else addMessage('Число от 1 до 10.', 'system');
      } else {
        game.money -= bet;
        number = Math.floor(Math.random() * 10) + 1;
        let win = number % 2 === 0 ? bet * 2 : 0;
        game.money += win;
        addMessage(`🎰 Случайно ${bet}💰. Выпало ${number}. ${win > 0 ? `+${win}💰!` : 'Проигрыш.'}`, 'bot');
      }
      saveGame();
    }

    function spawnMerchant() {
      if (game.merchant.active) return;
      const allItems = [
        { name: 'Зелье бодрости', price: 180, desc: 'Будит кота' },
        { name: 'Эликсир здоровья', price: 240, desc: '+50 к здоровью' },
        { name: 'Крылья для кота', price: 600, desc: 'Доход с прогулок x2' },
        { name: 'Золотой клубок', price: 420, desc: '+2 к опыту за действие' },
        { name: 'Лунный камень', price: 300, desc: 'Светится ночью' }
      ];
      let selected = [];
      while(selected.length < 3) {
        let item = allItems[Math.floor(Math.random() * allItems.length)];
        if (!selected.find(s => s.name === item.name)) selected.push(item);
      }
      game.merchant = { active: true, until: Date.now() + 7200000, items: selected };
      let text = '🧳 <b>Торговец прибыл!</b>\n';
      selected.forEach((it, i) => text += `${i+1}. ${it.name} - ${it.price}💰\n   <i>${it.desc}</i>\n`);
      text += '\n<i>купить у торговца [название]</i>';
      addMessage(text, 'system'); saveGame();
    }

    function showMerchant() {
      if (!game.merchant.active) return addMessage('Торговца сейчас нет.', 'system');
      let text = '🧳 <b>Товары торговца:</b>\n';
      game.merchant.items.forEach((it, i) => text += `${i+1}. ${it.name} - ${it.price}💰\n`);
      text += '\n<i>купить у торговца [название]</i>';
      addMessage(text, 'bot');
    }

    function buyFromMerchant(item) {
      if (!game.merchant.active) return addMessage('Торговец уехал.', 'system');
      let found = game.merchant.items.find(it => it.name.toLowerCase() === item);
      if (!found) return addMessage('Нет такого товара.', 'system');
      if (game.money < found.price) return addMessage('Недостаточно монет.', 'system');
      game.money -= found.price;
      if (found.name === 'Зелье бодрости') { game.isSleeping = false; addMessage('Кот проснулся!', 'bot'); }
      else if (found.name === 'Эликсир здоровья') { game.health = Math.min(100, game.health + 50); game.items.health_elixir = true; addMessage('Здоровье +50!', 'bot'); }
      else if (found.name === 'Крылья для кота') { game.items.cat_wings = true; addMessage('Крылья куплены!', 'bot'); }
      else if (found.name === 'Золотой клубок') { game.items.golden_ball = true; addMessage('Золотой клубок куплен!', 'bot'); }
      else if (found.name === 'Лунный камень') { game.collectibles.golden_fish++; addMessage('Лунный камень!', 'bot'); }
      game.merchant.items = game.merchant.items.filter(it => it.name !== found.name);
      if (game.merchant.items.length === 0) game.merchant.active = false;
      saveGame();
    }

    function useItem(item) {
      if (item === 'лакомство') giveTreat();
      else if (item === 'витамины') { if (game.vitamins <= 0) return addMessage('Нет витаминов.', 'system'); game.vitamins--; game.health = Math.min(100, game.health + 25); addMessage('Витамины приняты.', 'bot'); saveGame(); }
      else if (item === 'котовья мята' || item === 'мята') { if (game.catnip <= 0) return addMessage('Нет мяты.', 'system'); game.catnip--; game.mood = Math.min(100, game.mood + 30); addMessage('Кот под кайфом!', 'bot'); saveGame(); }
      else if (item === 'золотой клубок' && game.items.golden_ball) { gainExp(20); addMessage('Опыт +20!', 'bot'); saveGame(); }
      else addMessage('Нельзя использовать.', 'system');
    }

    function showDiary() {
      if (!game.diary.length) return addMessage('Дневник пуст.', 'system');
      addMessage('📖\n' + game.diary.slice(-6).reverse().map(e => `▸ ${e.text}`).join('\n'), 'bot');
    }

    function showAchievements() {
      let list = [
        {id:'walker',name:'Исследователь',desc:'5 прогулок',reward:80},
        {id:'vet',name:'Ветеринар',desc:'Визит к врачу',reward:100},
        {id:'hunter',name:'Охотник',desc:'3 удачных охоты',reward:120}
      ];
      let txt = '🏆\n' + list.map(a => `${game.achievements[a.id]?'✅':'🔒'} ${a.name} — ${a.desc} (${a.reward}💰)`).join('\n');
      addMessage(txt, 'bot');
    }

    function checkAchievement(id) {
      if (game.achievements[id]) return;
      let unlock = false;
      if (id==='walker') unlock = game.walks >= 5;
      else if (id==='vet') unlock = game.vetVisits >= 1;
      else if (id==='hunter') unlock = (game.achievements.hunterCount||0) >= 3;
      if (unlock) {
        game.achievements[id] = true;
        let reward = {walker:80, vet:100, hunter:120}[id] || 50;
        game.money += reward;
        addMessage(`🏆 Достижение! +${reward}💰`, 'system');
        saveGame();
      }
    }

    function skipTime(min) {
      for(let i=0; i<Math.floor(min/5); i++) {
        game.hunger = Math.max(0, game.hunger-0.8);
        game.thirst = Math.max(0, game.thirst-0.6);
        game.litter = Math.max(0, game.litter-0.3);
      }
      addMessage(`⏳ ${min} мин.`, 'system');
      saveGame();
    }

    function showHelp() {
      addMessage(`📋 Команды: статус, предложить играть/гулять/охоту/трюк/искать/купаться, гладить, лакомство, поговорить, лазер, ветеринар, убрать лоток, разбудить, магазин, инвентарь, продать [предмет], лотерея, ставка [сумма], рулетка [число] [ставка], торговец, дневник, достижения, купить [товар], купить у торговца [товар], использовать [предмет], осмотреться, кухня/спальня/ванная/гостиная, ждать [мин], назвать [имя]`, 'bot');
    }

    function randomEvent() {
      const events = [
        { id:'bird', description:'🐦 Кот поймал птичку!', choices:[
          {short:'Отпустить', text:'Вы отпустили птицу. +15 настроения.', mood:15},
          {short:'Съесть', text:'Позволили съесть. +20 сытости.', hunger:20},
          {short:'В клетку', text:'Птица в клетке (можно продать).', item:'bird_cage'}
        ]},
        { id:'sock', description:'🧦 Сфинкс притащил носок!', choices:[
          {short:'Выбросить', text:'Выбросили. -5 настроения.', mood:-5},
          {short:'Поиграть', text:'Веселье! +10 настроения.', mood:10},
          {short:'Оставить', text:'Коллекция носков.', item:'sock_collection'}
        ]}
      ];
      let ev = events[Math.floor(Math.random()*events.length)];
      game.pendingEvent = ev;
      addMessage(`${ev.description}\n1. ${ev.choices[0].short}\n2. ${ev.choices[1].short}\n3. ${ev.choices[2].short}\n<i>Введите 1-3</i>`, 'system');
    }

    // ========== ФОН ==========
    function backgroundTick() {
      if (game.merchant.active && Date.now() > game.merchant.until) {
        game.merchant.active = false; game.merchant.items = [];
        addMessage('🧳 Торговец уехал.', 'system'); saveGame();
      }
      if (!game.merchant.active && Math.random() < 0.02) spawnMerchant();
      autonomousCatTick();
      if (!game.pendingEvent && !game.isSleeping && Math.random() < 0.08) randomEvent();
    }

    // ========== СТАРТ ==========
    window.onload = function() {
      loadGame();
      setInterval(backgroundTick, 30000);
      addMessage(`🐈‍⬛ Добро пожаловать в "Сфинкс: Эволюция 2.0"! Введите <b>помощь</b>.`, 'bot');
      showStatus();
    };

    document.getElementById('cmd-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        let cmd = this.value.trim();
        if (cmd) { addMessage(cmd, 'user'); processCommand(cmd); }
        this.value = '';
      }
    });

    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        let cmd = this.dataset.cmd;
        addMessage(cmd, 'user');
        processCommand(cmd);
      });
    });
  })();
</script>
</body>
</html>
