<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сфинкс: живой кот</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сфинкс">
  <link rel="manifest" id="manifest-link">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; box-shadow: 0 0 20px #000; }
    #header { background: #16213e; padding: 12px; text-align: center; color: #e94560; font-weight: bold; font-size: 1.2em; border-bottom: 2px solid #e94560; }
    #chat { flex:1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s; }
    .msg.bot { background: #2d2d5e; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: #e94560; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.system { background: #4a3b5c; color: #ffb347; align-self: center; font-style: italic; font-size: 0.9em; max-width: 90%; }
    .time { font-size: 0.7em; color: #aaa; margin-top: 2px; text-align: right; }
    .msg.bot .time { text-align: left; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    #input-area { display: flex; flex-direction: column; padding: 8px; background: #0f0f1a; border-top: 1px solid #333; gap: 6px; }
    #cmd-row { display: flex; gap: 6px; }
    #cmd-input { flex: 1; min-width: 100px; background: #2a2a4a; border: none; padding: 10px; border-radius: 20px; color: white; font-size: 14px; outline: none; }
    .quick-btn { background: #3a3a6a; border: none; color: #ccc; padding: 8px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .quick-btn:active { background: #e94560; color: white; }
    .row-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">🐈‍⬛ СФИНКС • ЖИВОЙ КОТ</div>
  <div id="chat"></div>
  <div id="input-area">
    <div id="cmd-row">
      <input type="text" id="cmd-input" placeholder="Предложение или команда..." autofocus>
    </div>
    <div class="row-buttons">
      <button class="quick-btn" data-cmd="статус">📋 Статус</button>
      <button class="quick-btn" data-cmd="предложить играть">🎮 Игра</button>
      <button class="quick-btn" data-cmd="гладить">🤚 Гладить</button>
      <button class="quick-btn" data-cmd="предложить гулять">🚶 Гулять</button>
      <button class="quick-btn" data-cmd="предложить охоту">🐭 Охота</button>
      <button class="quick-btn" data-cmd="предложить трюк">🐾 Трюк</button>
      <button class="quick-btn" data-cmd="лазер">🔴 Лазер</button>
      <button class="quick-btn" data-cmd="предложить искать">🔍 Искать</button>
      <button class="quick-btn" data-cmd="ветеринар">🏥 Вет</button>
      <button class="quick-btn" data-cmd="предложить купаться">🛁 Купать</button>
      <button class="quick-btn" data-cmd="лакомство">🍬 Лакомство</button>
      <button class="quick-btn" data-cmd="поговорить">💬 Мяу</button>
      <button class="quick-btn" data-cmd="убрать лоток">🧹 Лоток</button>
      <button class="quick-btn" data-cmd="предложить спать">😴 Спать</button>
      <button class="quick-btn" data-cmd="разбудить">⏰ Будить</button>
      <button class="quick-btn" data-cmd="магазин">🛒 Магазин</button>
      <button class="quick-btn" data-cmd="инвентарь">🎒 Инв</button>
      <button class="quick-btn" data-cmd="продать">💰 Продать</button>
      <button class="quick-btn" data-cmd="царапка">🎟️ Царапка</button>
      <button class="quick-btn" data-cmd="ставка">🎲 Ставка</button>
      <button class="quick-btn" data-cmd="рулетка">🎰 Рулетка</button>
      <button class="quick-btn" data-cmd="торговец">🧳 Торговец</button>
      <button class="quick-btn" data-cmd="дневник">📖 Дневник</button>
      <button class="quick-btn" data-cmd="достижения">🏆</button>
      <button class="quick-btn" data-cmd="помощь">❓</button>
    </div>
  </div>
</div>

<script>
  // ========== PWA MANIFEST ==========
  (function() {
    const manifest = {
      name: "Сфинкс: живой кот",
      short_name: "Сфинкс",
      start_url: ".",
      display: "standalone",
      background_color: "#0f0f1a",
      theme_color: "#1a1a2e",
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐈‍⬛%3C/text%3E%3C/svg%3E",
        sizes: "100x100",
        type: "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    document.getElementById('manifest-link').href = url;
  })();
</script>
<script>
  // ========== SERVICE WORKER (офлайн-кеш) ==========
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
        const CACHE_NAME = 'sphinx-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => {
              return cache.addAll(['./']).catch(() => {});
            })
          );
          self.skipWaiting();
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((resp) => resp || fetch(e.request))
          );
        });
      `)).catch(() => {});
    });
  }
</script>
<script>
  (function() {
    // ---------- СОСТОЯНИЕ ----------
    const STAGES = ['kitten','teen','young','adult','mature','senior','old'];
    const STAGE_DAYS = 45;

    let game = {
      name: 'Барсик', gender: 'male', birth: new Date().toISOString(),
      hunger: 100, thirst: 100, mood: 80, energy: 100, litter: 100, health: 100,
      money: 200, foodSupply: 10, waterSupply: 10, litterSupply: 5,
      items: {
        gps_collar: false, laser_pointer: false, cave_house: false,
        scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false
      },
      treats: 0, vitamins: 0,
      diary: [], isSleeping: false,
      achievements: {}, currentDesire: null, location: 'гостиная', walks: 0, vetVisits: 0,
      lastHunt: null, lastDailyBonus: null, lastTrick: null,
      pendingEvent: null, sockCollectionIncome: 0,
      merchant: { active: false, until: null, items: [] },
      collectibles: { golden_fish: 0, catnip: 0, mouse_toy: 0 }
    };

    function loadGame() {
      try {
        let saved = localStorage.getItem('sphinx_chat_v6');
        if (saved) {
          let parsed = JSON.parse(saved);
          game = Object.assign(game, parsed);
          if (!game.items) game.items = { gps_collar: false, laser_pointer: false, cave_house: false, scratching_post: false, heated_bed: false, bird_cage: false, sock_collection: false };
          if (!game.treats) game.treats = 0;
          if (!game.vitamins) game.vitamins = 0;
          if (!game.achievements) game.achievements = {};
          if (!game.location) game.location = 'гостиная';
          if (!game.walks) game.walks = 0;
          if (!game.vetVisits) game.vetVisits = 0;
          if (!game.lastHunt) game.lastHunt = null;
          if (!game.lastDailyBonus) game.lastDailyBonus = null;
          if (!game.lastTrick) game.lastTrick = null;
          if (!game.pendingEvent) game.pendingEvent = null;
          if (!game.merchant) game.merchant = { active: false, until: null, items: [] };
          if (!game.collectibles) game.collectibles = { golden_fish: 0, catnip: 0, mouse_toy: 0 };
        }
      } catch(e){}
    }

    function saveGame() {
      localStorage.setItem('sphinx_chat_v6', JSON.stringify(game));
    }

    function ageDays() {
      return (Date.now() - new Date(game.birth).getTime()) / (1000*60*60*24);
    }

    function currentStage() {
      let idx = Math.min(Math.floor(ageDays() / STAGE_DAYS), STAGES.length-1);
      return STAGES[idx] || 'kitten';
    }

    function addMessage(text, sender='bot') {
      let chat = document.getElementById('chat');
      let div = document.createElement('div');
      div.className = `msg ${sender}`;
      let now = new Date();
      div.innerHTML = text + `<div class="time">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function bar(value) {
      let p = Math.max(0, Math.min(100, Math.round(value)));
      let filled = Math.round(p/10);
      return '█'.repeat(filled) + '░'.repeat(10-filled) + ` ${p}%`;
    }

    // ========== ОБРАБОТКА КОМАНД ==========
    function processCommand(cmd) {
      cmd = cmd.trim().toLowerCase();
      if (game.pendingEvent) {
        handlePendingEvent(cmd);
        return;
      }
      const firstWord = cmd.split(' ')[0];
      // Действия, разрешённые во время сна (финансы, просмотр, уход за лотком, разбудить)
      const awakeOnly = ['предложить','гладить','лакомство','поговорить','лазер','ветеринар','искать','трюк','охота','играть','гулять','купать','спать','разбудить','ждать','назвать','осмотреться','кухня','спальня','ванная','гостиная','использовать','кормить','поить','лоток']; // устаревшие
      if (game.isSleeping && awakeOnly.includes(firstWord) && firstWord !== 'разбудить') {
        addMessage('Кот спит… можно только разбудить.', 'system');
        return;
      }

      switch(firstWord) {
        case 'статус': showStatus(); break;
        case 'убрать': if (cmd === 'убрать лоток') cleanLitterBox(); else addMessage('Неизвестно.', 'system'); break;
        case 'предложить':
          if (cmd.startsWith('предложить играть') || cmd === 'предложить играть') proposePlay();
          else if (cmd.startsWith('предложить гулять')) proposeWalk();
          else if (cmd.startsWith('предложить охоту')) proposeHunt();
          else if (cmd.startsWith('предложить трюк')) proposeTrick();
          else if (cmd.startsWith('предложить искать')) proposeSearch();
          else if (cmd.startsWith('предложить купаться')) proposeBath();
          else if (cmd.startsWith('предложить спать')) proposeSleep();
          else addMessage('Предложение не распознано.', 'system');
          break;
        case 'гладить': proposePet(); break;
        case 'лакомство': giveTreat(); break;
        case 'поговорить': meow(); break;
        case 'лазер': proposeLaser(); break;
        case 'ветеринар': proposeVet(); break;
        case 'разбудить': wakeUp(); break;
        case 'магазин': shop(); break;
        case 'инвентарь': showInventory(); break;
        case 'продать':
          if (cmd.startsWith('продать ')) sellItem(cmd.replace('продать ','').trim());
          else sellPrompt();
          break;
        case 'царапка': scratchCard(); break;
        case 'ставка': sportBet(cmd); break;
        case 'рулетка': roulette(cmd); break;
        case 'торговец': showMerchant(); break;
        case 'дневник': showDiary(); break;
        case 'достижения': showAchievements(); break;
        case 'помощь': showHelp(); break;
        case 'купить':
          if (cmd.startsWith('купить у торговца ')) buyFromMerchant(cmd.replace('купить у торговца ','').trim());
          else if (cmd.startsWith('купить ')) buyItem(cmd.replace('купить ','').trim());
          else addMessage('Используйте: купить [товар] или купить у торговца [товар]', 'system');
          break;
        case 'использовать':
          if (cmd.startsWith('использовать ')) useItem(cmd.replace('использовать ','').trim());
          else addMessage('Что использовать?', 'system');
          break;
        case 'осмотреться': lookAround(); break;
        case 'кухня': case 'спальня': case 'ванная': case 'гостиная': changeLocation(cmd); break;
        default:
          if (cmd.startsWith('назвать ')) renameCat(cmd.replace('назвать ','').trim());
          else if (cmd.startsWith('ждать ')) {
            let m = parseInt(cmd.replace('ждать ',''));
            if (isNaN(m) || m<1 || m>480) addMessage('Минуты от 1 до 480.', 'system');
            else skipTime(m);
          }
          else if (cmd === 'когтеточка') useScratchingPost();
          else addMessage('Неизвестная команда. Введите помощь.', 'system');
      }
    }

    function handlePendingEvent(answer) { /* ... без изменений ... */
      const event = game.pendingEvent;
      if (!event) return;
      game.pendingEvent = null;
      const choice = parseInt(answer);
      if (isNaN(choice) || choice < 1 || choice > event.choices.length) {
        addMessage('Неверный выбор. Введите цифру 1, 2 или 3.', 'system');
        game.pendingEvent = event;
        return;
      }
      const outcome = event.choices[choice-1];
      if (outcome.money) game.money += outcome.money;
      if (outcome.hunger) game.hunger = Math.min(100, Math.max(0, game.hunger + outcome.hunger));
      if (outcome.mood) game.mood = Math.min(100, Math.max(0, game.mood + outcome.mood));
      if (outcome.energy) game.energy = Math.min(100, Math.max(0, game.energy + outcome.energy));
      if (outcome.health) game.health = Math.min(100, Math.max(0, game.health + outcome.health));
      if (outcome.item) game.items[outcome.item] = true;
      addMessage(outcome.text, 'bot');
      game.diary.push({time: new Date().toISOString(), text: `Событие: ${event.description} → ${outcome.short}`});
      saveGame();
    }

    // ========== АВТОНОМНЫЕ ДЕЙСТВИЯ КОТА ==========
    function autonomousCatTick() {
      if (game.pendingEvent) return;
      if (game.isSleeping) {
        // Во сне восстанавливается энергия, медленно падает голод
        game.energy = Math.min(100, game.energy + 2);
        game.hunger = Math.max(0, game.hunger - 0.1);
        if (game.energy >= 90) {
          game.isSleeping = false;
          addMessage('Кот проснулся и потягивается.', 'bot');
          game.diary.push({time: new Date().toISOString(), text: 'Проснулся сам.'});
          saveGame();
        }
        return;
      }

      // Приоритеты автономных действий (если не спит)
      if (game.hunger < 40 && game.foodSupply > 0) {
        // ест
        game.foodSupply--;
        game.hunger = Math.min(100, game.hunger + 35);
        addMessage('Кот подошёл к миске и поел.', 'bot');
        game.diary.push({time: new Date().toISOString(), text: 'Поел сам.'});
        game.currentDesire = null;
        saveGame();
        return;
      }
      if (game.thirst < 40 && game.waterSupply > 0) {
        game.waterSupply--;
        game.thirst = Math.min(100, game.thirst + 35);
        addMessage('Кот попил воды.', 'bot');
        game.diary.push({time: new Date().toISOString(), text: 'Попил сам.'});
        game.currentDesire = null;
        saveGame();
        return;
      }
      if (game.litter < 25 && game.litterSupply > 0 && game.currentDesire !== 'чистый лоток') {
        game.currentDesire = 'чистый лоток';
        addMessage('Кот мяукает у лотка — пора убрать!', 'system');
        saveGame();
        return;
      }
      if (game.energy < 25) {
        game.isSleeping = true;
        addMessage('Кот устал и лёг спать.', 'bot');
        game.diary.push({time: new Date().toISOString(), text: 'Лёг спать.'});
        saveGame();
        return;
      }
      if (game.mood < 50 && game.energy > 40) {
        // развлекает себя сам
        let toy = game.items.laser_pointer ? 'лазерной указкой' : (game.items.scratching_post ? 'когтеточкой' : 'с воображаемой мышкой');
        game.mood = Math.min(100, game.mood + 10);
        game.energy = Math.max(0, game.energy - 10);
        addMessage(`Кот играет ${toy}.`, 'bot');
        game.diary.push({time: new Date().toISOString(), text: 'Поиграл сам.'});
        saveGame();
        return;
      }
      // пассивное снижение показателей
      game.hunger = Math.max(0, game.hunger - 0.5);
      game.thirst = Math.max(0, game.thirst - 0.6);
      game.energy = Math.max(0, game.energy - 0.3);
      game.litter = Math.max(0, game.litter - 0.4);
      // если лоток совсем грязный и наполнителя нет, страдает здоровье
      if (game.litter <= 0 && game.litterSupply <= 0) {
        game.health = Math.max(0, game.health - 2);
        if (game.health <= 0) {
          addMessage('Кот заболел… ему срочно нужен ветеринар!', 'system');
        }
      }
      saveGame();
    }

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function proposePlay() {
      if (game.isSleeping) return;
      if (game.energy < 20) return addMessage('Кот не хочет — слишком устал.', 'bot');
      if (game.mood < 30 && Math.random() > 0.3) return addMessage('Кот не в настроении играть.', 'bot');
      game.mood = Math.min(100, game.mood + 15);
      game.energy = Math.max(0, game.energy - 15);
      addMessage('Вы поиграли! Кот носится как угорелый.', 'bot');
      game.diary.push({time: new Date().toISOString(), text: 'Играл с хозяином.'});
      saveGame();
    }

    function proposePet() {
      if (game.isSleeping) return;
      if (game.mood < 20 && Math.random() > 0.2) return addMessage('Кот уворачивается от руки — не сейчас.', 'bot');
      game.mood = Math.min(100, game.mood + 12);
      game.energy = Math.max(0, game.energy - 2);
      addMessage('Кот мурчит и подставляет пузо.', 'bot');
      game.diary.push({time: new Date().toISOString(), text: 'Гладили.'});
      saveGame();
    }

    function proposeWalk() {
      if (!game.items.gps_collar) return addMessage('Нужен GPS-ошейник.', 'system');
      if (game.isSleeping || game.energy < 30) return addMessage('Кот слишком устал для прогулки.', 'bot');
      if (Math.random() < 0.3) return addMessage('Кот не хочет выходить.', 'bot');
      game.energy -= 20;
      game.mood = Math.min(100, game.mood + 15);
      game.walks++;
      let reward = Math.floor(Math.random()*20)+5;
      game.money += reward;
      addMessage(`Прогулка удалась! +${reward}💰`, 'bot');
      game.diary.push({time: new Date().toISOString(), text: 'Гулял.'});
      checkAchievement('walker');
      saveGame();
    }

    function proposeHunt() {
      if (game.isSleeping || game.energy < 25) return addMessage('Кот не расположен к охоте.', 'bot');
      const now = Date.now();
      if (game.lastHunt && (now - new Date(game.lastHunt).getTime()) < 3600000) {
        return addMessage('Охота доступна раз в час.', 'system');
      }
      if (Math.random() < 0.3) return addMessage('Кот лениво отворачивается.', 'bot');
      game.energy -= 20;
      game.lastHunt = new Date().toISOString();
      let ok = Math.random() < 0.7;
      let reward = ok ? Math.floor(Math.random()*40)+10 : 0;
      game.money += reward;
      addMessage(ok ? `Поймал добычу! +${reward}💰` : 'Мышь убежала.', 'bot');
      game.diary.push({time: new Date().toISOString(), text: ok ? 'Удачная охота.' : 'Охота без улова.'});
      if (ok) checkAchievement('hunter');
      saveGame();
    }

    function proposeTrick() {
      if (game.isSleeping || game.energy < 10) return addMessage('Кот устал.', 'bot');
      if (Math.random() < 0.4) return addMessage('Кот делает вид, что не понимает.', 'bot');
      game.energy -= 8;
      if (Math.random() < 0.6) {
        let r = Math.floor(Math.random()*15)+5;
        game.money += r;
        addMessage(`Дал лапу! +${r}💰`, 'bot');
      } else {
        addMessage('Кот крутится вокруг, но команду не выполняет.', 'bot');
      }
      saveGame();
    }

    function proposeSearch() {
      if (game.isSleeping || game.energy < 15) return addMessage('Кот не хочет искать.', 'bot');
      game.energy -= 12;
      if (Math.random() < 0.5) {
        let r = Math.floor(Math.random()*15)+3;
        game.money += r;
        addMessage(`Нашёл что-то интересное! +${r}💰`, 'bot');
      } else {
        addMessage('Ничего не найдено.', 'bot');
      }
      saveGame();
    }

    function proposeBath() {
      if (game.isSleeping || game.energy < 20) return addMessage('Кот слишком устал.', 'bot');
      if (Math.random() < 0.6) return addMessage('Кот вырывается — купание отменяется.', 'bot');
      game.energy -= 15;
      game.mood = Math.min(100, game.mood + (Math.random() > 0.4 ? 10 : -5));
      addMessage('Кот нехотя принял ванну.', 'bot');
      saveGame();
    }

    function proposeSleep() {
      if (game.isSleeping) return;
      if (game.energy > 60) return addMessage('Кот не хочет спать — ещё полон сил.', 'bot');
      game.isSleeping = true;
      addMessage('Кот сворачивается клубочком и засыпает.', 'bot');
      saveGame();
    }

    function wakeUp() {
      if (!game.isSleeping) return;
      if (game.energy < 60) {
        addMessage('Кот недовольно дёргает ухом и продолжает спать.', 'bot');
        return;
      }
      game.isSleeping = false;
      addMessage('Вы разбудили кота. Он потягивается.', 'bot');
      saveGame();
    }

    function giveTreat() {
      if (game.treats <= 0) return addMessage('Нет лакомств.', 'system');
      game.treats--;
      game.mood = Math.min(100, game.mood + 20);
      game.hunger = Math.min(100, game.hunger + 5);
      addMessage('Кот с удовольствием съел лакомство!', 'bot');
      game.diary.push({time: new Date().toISOString(), text: 'Дали лакомство.'});
      saveGame();
    }

    function proposeLaser() {
      if (!game.items.laser_pointer) return addMessage('Нет лазерной указки.', 'system');
      if (game.isSleeping || game.energy < 15) return addMessage('Кот устал для лазера.', 'bot');
      if (Math.random() < 0.2) return addMessage('Кот игнорирует точку.', 'bot');
      game.energy -= 12;
      game.mood = Math.min(100, game.mood + 15);
      addMessage('Кот гоняется за пятнышком!', 'bot');
      saveGame();
    }

    function proposeVet() {
      if (game.money < 50) return addMessage('Нужно 50💰.', 'system');
      if (game.health >= 90 && Math.random() < 0.5) return addMessage('Кот отказывается идти к врачу.', 'bot');
      game.money -= 50;
      game.health = 100;
      game.vetVisits++;
      addMessage('Ветеринар осмотрел кота. Здоровье в порядке.', 'bot');
      checkAchievement('vet');
      saveGame();
    }

    function cleanLitterBox() {
      if (game.litterSupply <= 0) return addMessage('Нет наполнителя! Купите в магазине.', 'system');
      game.litterSupply--;
      game.litter = 100;
      game.mood = Math.min(100, game.mood + 15);
      game.currentDesire = null;
      addMessage('Лоток вычищен. Кот довольно урчит.', 'bot');
      game.diary.push({time: new Date().toISOString(), text: 'Убрали лоток.'});
      saveGame();
    }

    function meow() {
      addMessage(['Мяу!','Мр-ряу!','Мя?','Мур.','Р-р-мяу!'][Math.floor(Math.random()*5)], 'bot');
      saveGame();
    }

    // Остальные функции (showStatus, shop, buyItem, sellItem, diary, achievements, randomEvent, backgroundTick) оставлены практически без изменений, только адаптированы под новую логику
    function showStatus() {
      let sleep = game.isSleeping ? ' 😴 Спит' : '';
      let desire = game.currentDesire ? `\n💭 Хочет: ${game.currentDesire}` : '';
      let msg = `🐈‍⬛ <b>${game.name}</b> (${currentStage()})${sleep}\n`;
      msg += `🍗 Сытость: ${bar(game.hunger)}  (корма: ${game.foodSupply})\n`;
      msg += `💧 Жажда: ${bar(game.thirst)}  (воды: ${game.waterSupply})\n`;
      msg += `⚡ Энергия: ${bar(game.energy)}\n`;
      msg += `😊 Настроение: ${bar(game.mood)}\n`;
      msg += `🚽 Лоток: ${bar(game.litter)}  (наполнитель: ${game.litterSupply})\n`;
      msg += `❤️ Здоровье: ${bar(game.health)}\n`;
      msg += `💰 Монеты: ${game.money}  📍 ${game.location}${desire}`;
      addMessage(msg, 'bot');
    }

    function shop() {
      let t = `🛒 Магазин:\n🍗Корм(10)-50 💧Вода(10)-30 🧻Наполнитель(5)-40 🍬Лакомство-20 💊Витамины-80\n🔴Лазер-150 📡Ошейник-200 🏠Домик-250 🪶Когтеточка-180 🛌Лежанка-220\n<i>купить [название]</i>`;
      if (game.merchant.active) t += `\n🔔 <b>Заезжий торговец</b> здесь! Введите торговец.`;
      addMessage(t, 'bot');
    }

    function buyItem(item) {
      const prices = {
        корм:50, вода:30, наполнитель:40, лакомство:20, витамины:80,
        лазер:150, 'лазерная указка':150, ошейник:200, 'gps ошейник':200,
        домик:250, 'домик-пещера':250, когтеточка:180, лежанка:220, 'лежанка с подогревом':220
      };
      const key = item;
      if (key==='корм') { if(game.money<50)return noMoney(); game.money-=50; game.foodSupply+=10; }
      else if (key==='вода') { if(game.money<30)return noMoney(); game.money-=30; game.waterSupply+=10; }
      else if (key==='наполнитель') { if(game.money<40)return noMoney(); game.money-=40; game.litterSupply+=5; }
      else if (key==='лакомство') { if(game.money<20)return noMoney(); game.money-=20; game.treats++; }
      else if (key==='витамины') { if(game.money<80)return noMoney(); game.money-=80; game.vitamins++; }
      else if (key.includes('лазер')||key.includes('указка')) {
        if(game.items.laser_pointer)return addMessage('Уже есть.'); if(game.money<150)return noMoney();
        game.money-=150; game.items.laser_pointer=true;
      }
      else if (key.includes('ошейник')||key.includes('gps')) {
        if(game.items.gps_collar)return addMessage('Уже есть.'); if(game.money<200)return noMoney();
        game.money-=200; game.items.gps_collar=true;
      }
      else if (key.includes('домик')) {
        if(game.items.cave_house)return addMessage('Уже есть.'); if(game.money<250)return noMoney();
        game.money-=250; game.items.cave_house=true;
      }
      else if (key.includes('когтеточка')) {
        if(game.items.scratching_post)return addMessage('Уже есть.'); if(game.money<180)return noMoney();
        game.money-=180; game.items.scratching_post=true;
      }
      else if (key.includes('лежанка')) {
        if(game.items.heated_bed)return addMessage('Уже есть.'); if(game.money<220)return noMoney();
        game.money-=220; game.items.heated_bed=true;
      }
      else return addMessage('Неверный товар.', 'system');
      addMessage('Куплено!', 'system'); saveGame();
    }

    function noMoney() { addMessage('Недостаточно денег.', 'system'); }

    function useItem(item) {
      if (item==='лакомство') giveTreat();
      else if (item==='витамины') giveVitamins();
      else if (item==='золотая рыбка' || item==='золотую рыбку') {
        if (game.collectibles.golden_fish <= 0) return addMessage('Нет золотой рыбки.', 'system');
        game.collectibles.golden_fish--;
        game.mood = Math.min(100, game.mood + 30);
        addMessage('🐠 Золотая рыбка исполняет желание! +30 настроения.', 'bot');
        saveGame();
      }
      else if (item==='кошачья мята' || item==='кошачью мяту') {
        if (game.collectibles.catnip <= 0) return addMessage('Нет кошачьей мяты.', 'system');
        game.collectibles.catnip--;
        game.mood = Math.min(100, game.mood + 20);
        game.energy = Math.max(0, game.energy - 5);
        addMessage('🌿 Кот в экстазе от мяты! +20 настроения, -5 энергии.', 'bot');
        saveGame();
      }
      else if (item==='игрушка-мышь' || item==='игрушку-мышь') {
        if (game.collectibles.mouse_toy <= 0) return addMessage('Нет игрушки-мыши.', 'system');
        game.collectibles.mouse_toy--;
        game.mood = Math.min(100, game.mood + 10);
        game.energy = Math.max(0, game.energy - 10);
        addMessage('🐭 Поиграли с мышкой! +10 настроения, -10 энергии.', 'bot');
        saveGame();
      }
      else addMessage('Нельзя использовать.', 'system');
    }

    function giveVitamins() {
      if(game.vitamins<=0)return addMessage('Нет витаминов.', 'system');
      game.vitamins--; game.health=Math.min(100,game.health+25); game.energy=Math.min(100,game.energy+15);
      addMessage('Полезно.', 'bot'); saveGame();
    }

    function useScratchingPost() {
      if(!game.items.scratching_post)return;
      game.mood=Math.min(100,game.mood+5);
      addMessage('Когти точут.', 'bot'); saveGame();
    }

    function sellPrompt() { addMessage('Введите продать [предмет].', 'system'); }
    function sellItem(item) {
      const prices = { лазер:75, ошейник:100, домик:125, когтеточка:90, лежанка:110, птичка:80, носки:50,
        'золотая рыбка':40, 'кошачья мята':30, 'игрушка-мышь':25 };
      let key = item.includes('лазер')?'laser_pointer':
               item.includes('ошейник')?'gps_collar':
               item.includes('домик')?'cave_house':
               item.includes('когтеточка')?'scratching_post':
               item.includes('лежанка')?'heated_bed':
               item.includes('птичка')?'bird_cage':
               item.includes('носок')?'sock_collection':
               item.includes('золот')?'golden_fish':
               item.includes('мят')?'catnip':
               item.includes('мыш')?'mouse_toy':null;
      if (!key) return addMessage('Что продать?', 'system');
      if (key === 'golden_fish' || key === 'catnip' || key === 'mouse_toy') {
        if (game.collectibles[key] <= 0) return addMessage('Нет предмета.', 'system');
        game.collectibles[key]--;
        game.money += prices[item] || 25;
      } else {
        if (!game.items[key]) return addMessage('Нет предмета.', 'system');
        game.items[key] = false;
        game.money += prices[item] || 30;
      }
      addMessage(`Продано за ${prices[item]||30}💰`, 'system');
      saveGame();
    }

    function showDiary() {
      if(!game.diary.length) return addMessage('Пусто.', 'system');
      let txt = '📖\n' + game.diary.slice(-8).reverse().map(e =>
        `▸ ${new Date(e.time).getHours()}:${new Date(e.time).getMinutes()} ${e.text}`).join('\n');
      addMessage(txt, 'bot');
    }

    function showAchievements() {
      const list = [
        {id:'first_feed',name:'Первый обед',desc:'Кот поел',r:50},
        {id:'first_drink',name:'Водопой',desc:'Кот попил',r:50},
        {id:'walker',name:'Исследователь',desc:'5 прогулок',r:80},
        {id:'vet',name:'Ветеринар',desc:'Визит к врачу',r:100},
        {id:'hunter',name:'Охотник',desc:'Удачных охот: 3',r:120}
      ];
      let txt = '🏆\n' + list.map(a =>
        `${game.achievements[a.id]?'✅':'🔒'} ${a.name} — ${a.desc} (${a.r}💰)`).join('\n');
      addMessage(txt, 'bot');
    }

    function checkAchievement(id) { /* без изменений */ }

    function scratchCard() {
      if (game.money < 10) return addMessage('Нужно 10💰.', 'system');
      game.money -= 10;
      let win = 0;
      const r = Math.random();
      if (r < 0.1) win = 50; else if (r < 0.3) win = 20; else if (r < 0.7) win = 5;
      game.money += win;
      addMessage(`Царапка: +${win}💰`, 'bot'); saveGame();
    }

    function sportBet(cmd) {
      const parts = cmd.split(' ');
      if (parts.length !== 2 || isNaN(parts[1])) return addMessage('🎲 Формат: ставка [сумма]', 'system');
      const amount = parseInt(parts[1]);
      if (amount <= 0 || amount > game.money) return addMessage('Неверная сумма.', 'system');
      game.money -= amount;
      const r = Math.random();
      let win = 0, text = '';
      if (r < 0.45) { win = amount * 2; text = `⚽ Выигрыш x2! +${win}💰`; }
      else if (r < 0.5) { win = amount * 3; text = `⚽ Сенсация x3! +${win}💰`; }
      else text = `⚽ Проигрыш. -${amount}💰`;
      game.money += win;
      addMessage(text, 'bot'); saveGame();
    }

    function roulette(cmd) {
      const parts = cmd.split(' ');
      if (parts.length !== 3 || isNaN(parts[1]) || isNaN(parts[2])) return addMessage('🎰 Формат: рулетка [сумма] [число 1-36]', 'system');
      const amount = parseInt(parts[1]);
      const num = parseInt(parts[2]);
      if (amount <= 0 || amount > game.money || num < 1 || num > 36) return addMessage('Неверная сумма или число.', 'system');
      game.money -= amount;
      const winNum = Math.floor(Math.random() * 36) + 1;
      if (num === winNum) {
        const win = amount * 36;
        game.money += win;
        addMessage(`🎰 Выпало ${winNum}! Вы угадали! +${win}💰`, 'bot');
      } else {
        addMessage(`🎰 Выпало ${winNum}. Мимо. -${amount}💰`, 'bot');
      }
      saveGame();
    }

    function spawnMerchant() {
      game.merchant.active = true;
      game.merchant.until = Date.now() + (15 + Math.random() * 30) * 60000;
      const goods = [
        { name: 'золотая рыбка', price: 120, key: 'golden_fish', desc: '+30 настроения' },
        { name: 'кошачья мята', price: 80, key: 'catnip', desc: '+20 настроения, -5 энергии' },
        { name: 'игрушка-мышь', price: 70, key: 'mouse_toy', desc: '+10 настроения, -10 энергии' },
        { name: 'лазерная указка', price: 130, key: 'laser_pointer', desc: 'игра с лазером', isItem: true },
        { name: 'GPS-ошейник', price: 180, key: 'gps_collar', desc: 'для прогулок', isItem: true },
        { name: 'когтеточка', price: 160, key: 'scratching_post', desc: 'точит когти', isItem: true }
      ];
      const count = Math.floor(Math.random() * 2) + 3;
      game.merchant.items = goods.sort(() => 0.5 - Math.random()).slice(0, count);
      addMessage('🧳 Заезжий торговец прибыл! Введите торговец.', 'system');
      saveGame();
    }

    function showMerchant() {
      if (!game.merchant.active) return addMessage('Торговца сейчас нет.', 'system');
      let msg = '🧳 Торговец:\n';
      game.merchant.items.forEach((g,i) => msg += `${i+1}. ${g.name} — ${g.price}💰 (${g.desc})\n`);
      msg += '<i>купить у торговца [название]</i>';
      addMessage(msg, 'bot');
    }

    function buyFromMerchant(itemName) {
      if (!game.merchant.active) return addMessage('Торговец уже уехал.', 'system');
      const good = game.merchant.items.find(g => g.name === itemName);
      if (!good) return addMessage('Нет такого товара.', 'system');
      if (game.money < good.price) return noMoney();
      game.money -= good.price;
      if (good.key === 'golden_fish' || good.key === 'catnip' || good.key === 'mouse_toy') {
        game.collectibles[good.key]++;
      } else if (good.isItem) {
        if (game.items[good.key]) return addMessage('Уже есть.', 'system');
        game.items[good.key] = true;
      }
      addMessage(`Куплено: ${good.name}.`, 'system');
      saveGame();
    }

    function lookAround() { addMessage(`Вы в ${game.location}.`, 'bot'); }
    function changeLocation(loc) { game.location = loc; addMessage(`Перешли в ${loc}.`, 'system'); saveGame(); }
    function renameCat(name) { if(name.length>20)return; game.name=name; addMessage(`Теперь ${name}.`, 'system'); saveGame(); }
    function skipTime(min) {
      let ticks = Math.floor(min/5);
      for(let i=0;i<ticks;i++) {
        if(game.isSleeping) { game.energy=Math.min(100,game.energy+1.5); game.hunger=Math.max(0,game.hunger-0.2); }
        else { game.hunger=Math.max(0,game.hunger-0.8); game.thirst=Math.max(0,game.thirst-0.6); game.energy=Math.max(0,game.energy-0.4); game.litter=Math.max(0,game.litter-0.3); }
      }
      addMessage(`⏳ ${min} мин.`, 'system');
      saveGame();
    }

    function showHelp() {
      addMessage(`🐈‍⬛ <b>Сфинкс — живой кот</b>
📋 Вы можете <b>предлагать</b>: играть, гулять, охоту, трюк, искать, купаться, спать, гладить, лакомство, лазер, ветеринар, поговорить.
🧹 Уход: убрать лоток (если есть наполнитель). Кот сам ест и пьёт из мисок.
💰 Экономика: магазин, продать, царапка, ставка, рулетка, торговец.
🛒 Купить корм/воду/наполнитель/предметы. Использовать лакомство/витамины/игрушки.
❓ Помощь — эта подсказка.`, 'bot');
    }

    function backgroundTick() {
      if (game.merchant.active && Date.now() > game.merchant.until) {
        game.merchant.active = false;
        game.merchant.items = [];
        addMessage('🧳 Торговец уехал.', 'system');
        saveGame();
      }
      if (!game.merchant.active && Math.random() < 0.02) spawnMerchant();
      autonomousCatTick();
      // Случайные события
      if (!game.pendingEvent && !game.isSleeping && Math.random() < 0.08) {
        randomEvent();
      }
    }

    function randomEvent() { /* без изменений */ }

    // ========== СТАРТ ==========
    window.onload = function() {
      loadGame();
      setInterval(backgroundTick, 30000);
      addMessage(`Добро пожаловать! Ваш сфинкс <b>${game.name}</b> живёт своей жизнью. Введите <b>помощь</b>.`, 'bot');
      showStatus();
    };

    document.getElementById('cmd-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        let cmd = this.value.trim();
        if (cmd) { addMessage(cmd, 'user'); processCommand(cmd); }
        this.value = '';
      }
    });

    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        let cmd = this.dataset.cmd;
        addMessage(cmd, 'user');
        processCommand(cmd);
      });
    });
  })();
</script>
</body>
</html>
